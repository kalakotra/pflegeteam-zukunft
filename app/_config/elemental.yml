---
Name: app-elemental
After:
  - '#elementalpageextension'
  - '#youwilllikeit-elements'
---
Page:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalPageExtension
  allowed_elements:
    - YouWillLikeIT\Elements\Elements\ElementHero
    - YouWillLikeIT\Elements\Elements\ElementTextMedia
    - YouWillLikeIT\Elements\Elements\ElementFeatureGrid
    - YouWillLikeIT\Elements\Elements\ElementCallToAction
    - YouWillLikeIT\Elements\Elements\ElementFaq
    - YouWillLikeIT\Elements\Elements\ElementTestimonials
    - YouWillLikeIT\Elements\Elements\ElementTeam
    - App\Elements\ElementJobList
    - DNADesign\ElementalUserForms\Model\ElementForm

DNADesign\Elemental\Models\BaseElement:
  inline_editable: false
  extensions:
    - YouWillLikeIT\Elements\Extensions\SectionStyleExtension

DNADesign\Elemental\Controllers\ElementController:
  include_default_styles: false

# Section styles → Bootstrap classes (module stays framework-agnostic)
YouWillLikeIT\Elements\Extensions\SectionStyleExtension:
  # Clean theme: white or a pale grey band only. 'dark'/'primary'/'image' map to the pale band
  # so the look stays calm even if an editor picks them.
  background_classes:
    light: 'bg-light'
    dark: 'bg-light'
    primary: 'bg-light'
    image: 'bg-light'
  spacing_classes:
    none: ''
    sm: 'section-space-sm'
    md: 'section-space'
    lg: 'section-space-lg'
  width_classes:
    default: 'container'
    narrow: 'container container-narrow'
    full: 'container-fluid px-0'

# Project fields on module elements (module never changed for this site)
YouWillLikeIT\Elements\Elements\ElementHero:
  extensions:
    - App\Extensions\Elements\HeroExtension

YouWillLikeIT\Elements\Elements\ElementFeatureGrid:
  extensions:
    - App\Extensions\Elements\FeatureGridExtension

YouWillLikeIT\Elements\Elements\ElementTextMedia:
  extensions:
    - App\Extensions\Elements\EyebrowExtension
    - App\Extensions\Elements\TextMediaExtension

YouWillLikeIT\Elements\Elements\ElementTestimonials:
  extensions:
    - App\Extensions\Elements\TestimonialsExtension
